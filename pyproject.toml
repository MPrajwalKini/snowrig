[project]
name = "snowrig"
version = "0.2.0"
description = "Free, always-available Snowflake automation: a lightweight Python-native manifest/plan/apply layer built on Snowflake's own official SDKs (snowflake.core + the Snowflake Connector), not a hand-rolled REST client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "snowflake>=1.0",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
snowrig = "snowrig.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
