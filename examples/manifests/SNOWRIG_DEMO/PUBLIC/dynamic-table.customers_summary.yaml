  # same class of problem Stream.stream_source has. core_client.py's
  # _coerce_dynamic_table_body() handles the translation below for you.
  # See CONTRIBUTING.md.
  target_lag:
    seconds: 60
  warehouse: COMPUTE_WH
  query: "SELECT ID, EMAIL FROM CUSTOMERS"
depends_on:
  - "table:SNOWRIG_DEMO.PUBLIC.CUSTOMERS"